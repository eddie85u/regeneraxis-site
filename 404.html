<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · RegenerAxis</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var saved = null;
        try { saved = localStorage.getItem("ra_lang"); } catch (e) {}
        // A saved choice wins; otherwise sniff the browser language on first
        // visit. Spanish is served at the root, English under /en/.
        var lang = (saved === "en" || saved === "es")
          ? saved
          : ((navigator.language || "es").toLowerCase().indexOf("en") === 0 ? "en" : "es");
        location.replace(lang === "en" ? "/en/" : "/");
      } catch (e) { location.replace("/"); }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1B1A17; color: #B9AF9E; font-family: -apple-system, "Segoe UI", sans-serif;
      font-weight: 300; letter-spacing: 0.04em; text-align: center; padding: 2rem; }
    a { color: #C7A96B; text-decoration: none; }
    h1 { font-family: Georgia, serif; font-weight: 300; color: #F4F0E8; }
  </style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>Return to <a href="/">RegenerAxis</a> · <a href="/en/">English</a></p>
  </div>
</body>
</html>
