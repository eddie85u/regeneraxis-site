  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var saved = null;
        try { saved = localStorage.getItem("ra_lang"); } catch (e) {}
        var lang = saved || ((navigator.language || "en").toLowerCase().indexOf("es") === 0 ? "es" : "en");
        if (lang !== "es") lang = "en";
        // Send stray URLs back to the language home. Keep it simple and safe.
        location.replace("/" + lang + "/");
      } catch (e) { location.replace("/en/"); }
    })();
  </script>

</head>
