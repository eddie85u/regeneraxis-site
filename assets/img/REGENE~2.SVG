<svg width="700" height="600" viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg">
  <title>RegenerAxis — Logo (versión en negativo)</title>
  <desc>Marca de dos elipses cruzadas en monolínea marfil sobre negro cálido, con anillo y ejes dorados y punto dorado central; wordmark RegenerAxis con "Axis" en oro champán y lema THE AXIS OF HUMAN RENEWAL.</desc>
  <rect width="700" height="600" fill="#1B1A17"/>
  <!-- anillo dorado -->
  <circle cx="350" cy="185" r="115" fill="none" stroke="#C7A96B" stroke-width="1.1"/>
  <!-- ejes dorados sutiles -->
  <line x1="350" y1="60" x2="350" y2="310" stroke="#C7A96B" stroke-width="0.9" opacity="0.7"/>
  <line x1="225" y1="185" x2="475" y2="185" stroke="#C7A96B" stroke-width="0.9" opacity="0.55"/>
  <!-- elipse vertical -->
  <ellipse cx="350" cy="185" rx="44" ry="96" fill="none" stroke="#F4F0E8" stroke-width="2.2"/>
  <!-- elipse horizontal -->
  <ellipse cx="350" cy="185" rx="96" ry="44" fill="none" stroke="#F4F0E8" stroke-width="2.2"/>
  <!-- núcleo dorado -->
  <circle cx="350" cy="185" r="9.5" fill="#C7A96B"/>
  <!-- wordmark -->
  <text x="350" y="455" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-size="76" letter-spacing="1">
    <tspan fill="#F4F0E8">Regener</tspan><tspan fill="#C7A96B">Axis</tspan>
  </text>
  <!-- lema -->
  <text x="350" y="505" text-anchor="middle" fill="#8E8574" font-family="'Century Gothic', 'Jost', sans-serif" font-size="17" letter-spacing="9">THE AXIS OF HUMAN RENEWAL</text>
</svg>
