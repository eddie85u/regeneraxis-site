  <!-- Language router: honor saved choice, else browser language, default English. -->
  <script>
    (function () {
      try {
        var saved = null;
        try { saved = localStorage.getItem("ra_lang"); } catch (e) {}
        var lang = saved || ((navigator.language || "en").toLowerCase().indexOf("es") === 0 ? "es" : "en");
        if (lang !== "es") lang = "en";
        location.replace("./" + lang + "/");
      } catch (e) {
        location.replace("./en/");
      }
    })();
  </script>
